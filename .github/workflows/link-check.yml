# ABOUTME: Monthly link-rot check over the guide's data and content files.
# ABOUTME: Opens a GitHub issue when lychee finds dead links.

name: Link Check

on:
  schedule:
    - cron: "0 14 1 * *"
  workflow_dispatch:

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --accept '200..=299,403,429' data/ content/
          output: ./lychee/out.md
          fail: false

      - name: Open issue on dead links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Link check: dead links found"
          content-filepath: ./lychee/out.md
          labels: link-rot
