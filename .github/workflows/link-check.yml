# ABOUTME: Monthly link-rot check over the guide's data and content files.
# ABOUTME: Opens or updates a GitHub issue when lychee finds dead links.

name: Link Check

on:
  schedule:
    - cron: "0 14 1 * *"
  workflow_dispatch:

# Manual runs could otherwise overlap the cron and race on issue updates
concurrency:
  group: link-check
  cancel-in-progress: true

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --no-progress --accept '200..=299,403,429' data/ content/
          output: ./lychee/out.md
          fail: false

      # --force makes this a no-op update when the label already exists
      - name: Ensure link-rot label exists
        if: steps.lychee.outputs.exit_code != 0
        run: gh label create link-rot --color "e4e669" --description "Detected dead links" --force
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Find existing link-rot issue
        if: steps.lychee.outputs.exit_code != 0
        id: find-issue
        run: |
          issue=$(gh issue list --label link-rot --state open --json number --jq '.[0].number // ""')
          echo "number=$issue" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Open or update issue on dead links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@e8ef132d6df98ed982188e460ebb3b5d4ef3a9cd # v5
        with:
          title: "Link check: dead links found"
          content-filepath: ./lychee/out.md
          labels: link-rot
          issue-number: ${{ steps.find-issue.outputs.number }}
